<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavebound Odyssey</title>
  <style>
    :root {
      --bg: #0d1426;
      --panel: rgba(12,18,31,.9);
      --panel-2: rgba(16,23,36,.96);
      --line: rgba(255,255,255,.1);
      --text: #edf6ff;
      --muted: #a9bdd6;
      --gold: #f4d35e;
      --green: #7fe3a2;
      --blue: #6fd7ff;
      --purple: #b399ff;
      --red: #ff7c7c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #12213d, #080d19 55%);
      color: var(--text);
      overflow: hidden;
    }
    body { display: flex; justify-content: center; align-items: center; }
    #game {
      width: min(1460px, 97vw); height: min(930px, 95vh);
      background: linear-gradient(180deg, #0f172b, #090d19);
      border: 1px solid var(--line); border-radius: 20px;
      overflow: hidden; box-shadow: 0 35px 90px rgba(0,0,0,.45); position: relative;
    }
    .hud {
      position: absolute; top: 0; left: 0; right: 0; height: 78px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; background: rgba(8,12,19,.8); border-bottom: 1px solid var(--line); z-index: 20;
    }
    .hud-left, .hud-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,.04); border: 1px solid var(--line); font-weight: 800; font-size: 12px;
    }
    .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px rgba(244,211,94,.8); }
    .chip.blue .dot { background: var(--blue); }
    .chip.green .dot { background: var(--green); }
    .chip.red .dot { background: var(--red); }
    .layout {
      position: absolute; inset: 78px 0 0 0; display: grid; grid-template-columns: 280px 1fr 300px; gap: 0;
    }
    .panel {
      background: rgba(9,15,23,.8); border-right: 1px solid var(--line); overflow: auto; padding: 12px;
    }
    .panel.right { border-right: none; border-left: 1px solid var(--line); }
    .section {
      background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px;
    }
    .section h3 {
      margin: 0 0 10px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 800;
    }
    .big-number { font-size: 32px; font-weight: 900; letter-spacing: -.06em; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button {
      border: none; border-radius: 10px; background: rgba(255,255,255,.07); color: var(--text); padding: 10px 12px; font-weight: 800; cursor: pointer; transition: transform .15s ease, filter .15s ease; font-size: 13px;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    button.primary { background: linear-gradient(180deg, #1cc7ff, #128fe8); color: white; }
    button.gold { background: linear-gradient(180deg, #ffd76a, #d9a61a); color: #1b1d1a; }
    button.success { background: linear-gradient(180deg, #79e99f, #38bb65); color: #0d2119; }
    button.warn { background: linear-gradient(180deg, #ff8d70, #f05d4d); }
    .inv-list, .quest-list, .fish-list, .shop-list { display: flex; flex-direction: column; gap: 8px; }
    .list-item {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); font-size: 13px;
    }
    .dot-tag {
      display: inline-block; padding: 4px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04);
    }
    .world-screen {
      position: relative; background: linear-gradient(180deg, #7ad5ff 0%, #d8effd 32%, #a9dcff 100%); overflow: hidden; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    }
    .sky { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(120,200,255,.22), rgba(255,255,255,.02)); }
    .sun {
      position: absolute; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(255,239,166,1) 0%, rgba(255,223,125,.9) 45%, rgba(255,223,125,.1) 100%); right: 120px; top: 46px; box-shadow: 0 0 70px rgba(255,218,112,.4);
    }
    .moon {
      position: absolute; width: 88px; height: 88px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95), rgba(210,224,255,.8)); right: 130px; top: 52px; box-shadow: 0 0 30px rgba(255,255,255,.5); opacity: .7;
    }
    .stars {
      position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 1px), radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px); background-position: 12% 18%, 40% 22%, 66% 12%, 76% 24%, 20% 30%, 86% 18%; background-size: 120px 120px; opacity: .8;
    }
    .island {
      position: absolute; border-radius: 32% 68% 48% 52% / 58% 30% 70% 42%; background: linear-gradient(180deg, #90c76d, #4f7d44); box-shadow: inset -10px -8px 0 rgba(0,0,0,.05), 0 18px 20px rgba(23,50,30,.25); z-index: 3;
    }
    .island.start { width: 190px; height: 96px; left: 60px; bottom: 85px; }
    .island.coral { width: 230px; height: 118px; left: 320px; bottom: 120px; }
    .island.frost { width: 250px; height: 124px; right: 260px; bottom: 110px; }
    .island.storm { width: 250px; height: 120px; right: 20px; bottom: 148px; }
    .island.depths { width: 340px; height: 150px; left: 50%; bottom: 30px; transform: translateX(-50%); }
    .island.volcano { width: 240px; height: 120px; left: 50%; top: 140px; transform: translateX(-50%); }
    .dock {
      position: absolute; width: 140px; height: 22px; background: linear-gradient(180deg, #755744, #4d352d); border-radius: 12px; box-shadow: 0 5px 14px rgba(0,0,0,.18); z-index: 5;
    }
    .dock.start { left: 120px; bottom: 118px; }
    .dock.coral { left: 400px; bottom: 150px; }
    .dock.frost { right: 320px; bottom: 140px; }
    .dock.storm { right: 120px; bottom: 170px; }
    .player {
      position: absolute; width: 28px; height: 28px; background: linear-gradient(180deg, #dff7ff, #78d8ff); border: 2px solid rgba(0,0,0,.28); border-radius: 50%; box-shadow: 0 10px 18px rgba(25,39,60,.28); z-index: 9;
    }
    .other-player {
      position: absolute; width: 24px; height: 24px; background: linear-gradient(180deg, #f5b7ff, #8f64ff); border-radius: 50%; border: 2px solid rgba(255,255,255,.4); z-index: 7; box-shadow: 0 6px 12px rgba(0,0,0,.22);
    }
    .other-player::after {
      content: attr(data-name); position: absolute; left: 12px; top: -18px; transform: translateX(-50%); font-size: 10px; color: white; background: rgba(0,0,0,.35); padding: 2px 5px; border-radius: 5px; white-space: nowrap;
    }
    .boat {
      position: absolute; width: 82px; height: 32px; background: linear-gradient(180deg, #b9734c, #7f4024); border-radius: 12px; box-shadow: 0 12px 16px rgba(28,15,10,.22); z-index: 6;
    }
    .boat::before {
      content: ""; position: absolute; left: 18px; right: 18px; top: -18px; height: 18px; background: linear-gradient(180deg, #a85c39, #6c3821); border-radius: 10px 10px 0 0;
    }
    .boat::after {
      content: ""; position: absolute; left: 28px; right: 28px; top: -16px; height: 8px; background: rgba(255,255,255,.6); border-radius: 8px;
    }
    .water {
      position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(180deg, rgba(29,121,202,.9), rgba(13,73,137,.97)); border-top: 1px solid rgba(255,255,255,.2); z-index: 2;
    }
    .water::before {
      content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 2px, transparent 2px 40px), linear-gradient(transparent 0 96%, rgba(255,255,255,.08) 96% 100%); opacity: .9;
    }
    .cave { position: absolute; width: 60px; height: 40px; background: rgba(15,18,24,.58); border-radius: 50%; border: 1px solid rgba(255,255,255,.16); z-index: 3; }
    .region-tag {
      position: absolute; left: 18px; top: 18px; z-index: 12; background: rgba(8,14,22,.74); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 900; letter-spacing: .07em; text-transform: uppercase;
    }
    .travel-card {
      position: absolute; right: 18px; bottom: 18px; z-index: 12; width: 235px; background: rgba(9,13,20,.72); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    }
    .travel-card h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .travel-btn { width: 100%; margin-top: 6px; }
    .minigame {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(580px, 82%); background: rgba(9,14,22,.96); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 28px 60px rgba(0,0,0,.55); z-index: 30; display: none;
    }
    .minigame.active { display: block; }
    .mini-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 900; }
    .mini-track {
      position: relative; height: 48px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); overflow: hidden; margin-top: 16px;
    }
    .mini-zone {
      position: absolute; left: 34%; top: 8px; width: 28%; height: 32px; border-radius: 10px; background: linear-gradient(180deg, rgba(95,241,145,.94), rgba(18,143,85,.9)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12);
    }
    .mini-fish {
      position: absolute; left: 8%; top: 8px; width: 18px; height: 32px; background: linear-gradient(180deg, #ffc4c4, #ff7a7a); border-radius: 12px 12px 10px 10px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12); transition: left .08s linear;
    }
    .mini-player {
      position: absolute; left: 50%; top: 8px; width: 26px; height: 32px; border-radius: 8px; background: linear-gradient(180deg, #b8fbff, #6de6ff); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); transition: left .08s linear;
    }
    .mini-status { display: flex; justify-content: space-between; margin-top: 14px; gap: 10px; font-size: 12px; color: var(--muted); }
    .mini-bar { height: 8px; border-radius: 12px; background: rgba(255,255,255,.06); overflow: hidden; border: 1px solid var(--line); }
    .mini-bar-fill { height: 100%; background: linear-gradient(90deg, #69f0a9, #30c77c); width: 0%; transition: width .1s linear; }
    .mini-output { margin-top: 14px; font-size: 13px; color: var(--muted); }
    @media (max-width: 1100px) { .layout { grid-template-columns: 220px 1fr 240px; } .panel { padding: 10px; } }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .panel.left, .panel.right { display: none; } .world-screen { border-left: none; border-right: none; } #game { height: 100vh; width: 100vw; border-radius: 0; } .hud { padding: 10px 12px; } }
  </style>
</head>
<body>
  <div id="game">
    <div class="hud">
      <div class="hud-left">
        <div class="chip"><span class="dot"></span> Level <span id="levelHud">1</span></div>
        <div class="chip blue"><span class="dot"></span> Gold <span id="goldHud">120</span></div>
        <div class="chip green"><span class="dot"></span> XP <span id="xpHud">0/80</span></div>
      </div>
      <div class="hud-right">
        <div class="chip"><span class="dot"></span> <span id="weatherHud">Sunny</span></div>
        <div class="chip red"><span class="dot"></span> <span id="regionHud">Starter Island</span></div>
      </div>
    </div>

    <div class="layout">
      <aside class="panel left">
        <div class="section">
          <h3>Player</h3>
          <div class="big-number" id="levelBig">1</div>
          <div class="button-row">
            <button class="primary" id="castBtn">Cast</button>
            <button class="gold" id="sellBtn">Sell Catch</button>
          </div>
        </div>

        <div class="section">
          <h3>Inventory</h3>
          <div class="inv-list">
            <div class="list-item"><span>Rod</span><strong id="currentRodDisplay">Cedar Rod</strong></div>
            <div class="list-item"><span>Bait</span><strong id="currentBaitDisplay">Worm</strong></div>
            <div class="list-item"><span>Boat</span><strong id="currentBoatDisplay">Dory</strong></div>
          </div>
        </div>

        <div class="section">
          <h3>Quests</h3>
          <div class="quest-list" id="questList"></div>
        </div>
      </aside>

      <main class="world-screen">
        <div class="sky"></div>
        <div class="sun" id="sun"></div>
        <div class="moon" id="moon" style="display:none;"></div>
        <div class="stars" id="stars" style="display:none;"></div>

        <div id="regionTag" class="region-tag">Starter Island</div>

        <div class="island start" data-region="Starter Island"></div>
        <div class="island coral" data-region="Coral Bay"></div>
        <div class="island frost" data-region="Frostwater"></div>
        <div class="island storm" data-region="Storm Coast"></div>
        <div class="island depths" data-region="Forgotten Depths"></div>
        <div class="island volcano" data-region="Volcanic Island"></div>

        <div class="dock start" data-region="Starter Island"></div>
        <div class="dock coral" data-region="Coral Bay"></div>
        <div class="dock frost" data-region="Frostwater"></div>
        <div class="dock storm" data-region="Storm Coast"></div>

        <div class="cave" style="left: 44%; bottom: 100px; opacity: .8;"></div>
        <div class="cave" style="right: 18%; bottom: 130px; opacity: .8;"></div>
        <div class="cave" style="left: 18%; bottom: 145px; opacity: .9;"></div>

        <div class="water"></div>
        <div class="player" id="player"></div>
        <div class="boat" id="boat"></div>

        <div class="travel-card">
          <h4>Travel</h4>
          <div id="travelButtons"></div>
        </div>
      </main>

      <aside class="panel right">
        <div class="section">
          <h3>Rod &amp; Bait</h3>
          <div class="shop-list" id="rodList"></div>
          <div class="shop-list" id="baitList"></div>
        </div>

        <div class="section">
          <h3>Collection</h3>
          <div class="fish-list" id="collectionList"></div>
        </div>

        <div class="section">
          <h3>Shop</h3>
          <div class="shop-list" id="shopList"></div>
        </div>
      </aside>
    </div>

    <div class="minigame" id="minigame">
      <div class="mini-head">
        <span id="miniFishName">Silverfin</span>
        <span id="miniRarity">Common</span>
      </div>
      <div class="mini-track">
        <div class="mini-zone"></div>
        <div class="mini-fish" id="miniFish"></div>
        <div class="mini-player" id="miniPlayer"></div>
      </div>
      <div class="mini-status">
        <span>Fish power: <strong id="fishPowerValue">0%</strong></span>
        <span>Control: <strong id="controlValue">0%</strong></span>
      </div>
      <div class="mini-bar"><div class="mini-bar-fill" id="miniProgressBar"></div></div>
      <div class="mini-output" id="miniOutput">Hold to battle the fish and keep the line steady.</div>
      <div class="button-row">
        <button class="primary" id="miniHoldBtn">Hold</button>
        <button class="warn" id="miniReleaseBtn">Release</button>
      </div>
    </div>
  </div>

    const rodCatalog = [

      miniFish: document.getElementById("miniFish"),
      miniPlayer: document.getElementById("miniPlayer"),
      miniFishName: document.getElementById("miniFishName"),
      miniRarity: document.getElementById("miniRarity"),
      fishPowerValue: document.getElementById("fishPowerValue"),
      controlValue: document.getElementById("controlValue"),
      miniProgressBar: document.getElementById("miniProgressBar"),
      miniOutput: document.getElementById("miniOutput"),
      miniHoldBtn: document.getElementById("miniHoldBtn"),
      miniReleaseBtn: document.getElementById("miniReleaseBtn"),
      regionTag: document.getElementById("regionTag"),
      sun: document.getElementById("sun"),
      moon: document.getElementById("moon"),
      stars: document.getElementById("stars")
    };

    function clamp(n,min,max){ return Math.min(max, Math.max(min,n)); }
    function getRodByName(name){ return rodCatalog.find(r => r.name === name) || rodCatalog[0]; }
    function getBaitByName(name){ return baitCatalog.find(b => b.name === name) || baitCatalog[0]; }
    function getPlayerLocation(){ return regions[state.currentRegion] || regions["Starter Island"]; }
    function levelForXp(xp){
      let level = 1; let need = 80; let rem = xp;
      while(rem >= need){ rem -= need; level++; need = Math.round(need * 1.32); }
      return { level, remaining: rem, need };
    }
    function getWeatherForTime(time){
      if (time >= 22 || time < 5) return "Night";
      if (time >= 5 && time < 8) return "Cloudy";
      if (time >= 8 && time < 12) return "Sunny";
      if (time >= 12 && time < 16) return "Sunny";
      if (time >= 16 && time < 18) return "Cloudy";
      if (time >= 18 && time < 20) return "Rain";
      return "Thunderstorm";
    }
    function maybeWeatherInfluence(region, weather){
      const map = {
        "Starter Island": ["Sunny","Cloudy","Rain"],
        "Coral Bay": ["Sunny","Rain","Cloudy"],
        "Frostwater": ["Snow","Blizzard","Fog","Cloudy"],
        "Storm Coast": ["Thunderstorm","Rain","Cloudy","Fog"],
        "Forgotten Depths": ["Night","Fog","Rain","Thunderstorm"],
        "Volcanic Island": ["Sunny","Thunderstorm","Cloudy"]
      };
      if (!map[region]) return weather;
      return map[region].includes(weather) ? weather : map[region][0];
    }
    function updateHud(){
      const { level, remaining, need } = levelForXp(state.xp);
      state.level = level;
      ui.goldHud.textContent = state.money;
      ui.xpHud.textContent = `${remaining}/${need}`;
      ui.levelHud.textContent = state.level;
      ui.levelBig.textContent = state.level;
      ui.regionHud.textContent = state.currentRegion;
      ui.weatherHud.textContent = state.weather;
      ui.currentRodDisplay.textContent = state.currentRod;
      ui.currentBaitDisplay.textContent = state.currentBait;
      ui.currentBoatDisplay.textContent = state.currentBoat;
      ui.regionTag.textContent = state.currentRegion;
      if (state.weather === "Night") { ui.sun.style.display = "none"; ui.moon.style.display = "block"; ui.stars.style.display = "block"; }
      else { ui.sun.style.display = "block"; ui.moon.style.display = "none"; ui.stars.style.display = "none"; }
    }
    function renderTravelButtons(){
      const btns = Object.keys(regions).map(region => {
        const unlocked = state.unlocks.includes(region);
        return `<button class="${unlocked ? 'gold travel-btn' : 'warn travel-btn'}" data-region="${region}" ${unlocked ? '' : 'disabled'}>${region}</button>`;
      }).join('');
      ui.travelButtons.innerHTML = btns;
      ui.travelButtons.querySelectorAll('button[data-region]').forEach(btn => {
        btn.addEventListener('click', () => {
          const region = btn.dataset.region;
          if (state.unlocks.includes(region)) {
            state.currentRegion = region;
            const loc = getPlayerLocation();
            state.playerX = loc.x; state.playerY = loc.y; renderWorld(); updateHud();
          }
        });
      });
    }
    function renderWorld(){
      const loc = getPlayerLocation();
      ui.player.style.left = `${loc.x}px`;
      ui.player.style.top = `${loc.y}px`;
      ui.boat.style.left = `${loc.x + 40}px`;
      ui.boat.style.top = `${loc.y + 18}px`;
      document.querySelectorAll('.other-player').forEach(el => el.remove());
      state.otherPlayers = [{ name: 'Luma', x: 220, y: 390 }, { name: 'Kite', x: 560, y: 420 }];
      state.otherPlayers.forEach(op => {
        const el = document.createElement('div');
        el.className = 'other-player';
        el.dataset.name = op.name;
        el.style.left = `${op.x}px`;
        el.style.top = `${op.y}px`;
        document.querySelector('.world-screen').appendChild(el);
      });
    }
    function renderRodList(){
      ui.rodList.innerHTML = rodCatalog.map(rod => {
        const owned = state.rodInventory.includes(rod.name);
        const active = rod.name === state.currentRod;
        return `
          <div class="list-item">
            <span>${rod.name} ${active ? '●' : ''}</span>
            <div>
              ${owned ? `<button data-rod="${rod.name}" class="${active ? 'success' : 'primary'}">${active ? 'Equipped' : 'Use'}</button>` : `<button data-buyrod="${rod.name}" class="gold">Buy ${rod.cost}</button>`}
            </div>
          </div>
        `;
      }).join('');
      ui.rodList.querySelectorAll('[data-rod]').forEach(btn => btn.addEventListener('click', () => { state.currentRod = btn.dataset.rod; updateHud(); renderRodList(); }));
      ui.rodList.querySelectorAll('[data-buyrod]').forEach(btn => btn.addEventListener('click', () => {
        const rod = rodCatalog.find(r => r.name === btn.dataset.buyrod);
        if (state.money >= rod.cost) { state.money -= rod.cost; state.rodInventory.push(rod.name); state.currentRod = rod.name; updateHud(); renderRodList(); }
      }));
    }
    function renderBaitList(){
      ui.baitList.innerHTML = baitCatalog.map(bait => {
        const owned = state.baitInventory.includes(bait.name);
        const active = bait.name === state.currentBait;
        return `
          <div class="list-item">
            <span>${bait.name} ${active ? '●' : ''}</span>
            <div>
              ${owned ? `<button data-bait="${bait.name}" class="${active ? 'success' : 'primary'}">${active ? 'Equipped' : 'Use'}</button>` : `<button data-buybait="${bait.name}" class="gold">Buy ${bait.cost}</button>`}
            </div>
          </div>
        `;
      }).join('');
      ui.baitList.querySelectorAll('[data-bait]').forEach(btn => btn.addEventListener('click', () => { state.currentBait = btn.dataset.bait; updateHud(); renderBaitList(); }));
      ui.baitList.querySelectorAll('[data-buybait]').forEach(btn => btn.addEventListener('click', () => {
        const bait = baitCatalog.find(b => b.name === btn.dataset.buybait);
        if (state.money >= bait.cost) { state.money -= bait.cost; state.baitInventory.push(bait.name); state.currentBait = bait.name; updateHud(); renderBaitList(); }
      }));
    }
    function renderCollection(){
      const map = {};
      state.fishInInventory.forEach(f => { map[f.name] = (map[f.name] || 0) + 1; });
      const entries = Object.entries(map).slice(0, 8);
      ui.collectionList.innerHTML = entries.length ? entries.map(([name,count]) => `<div class="list-item"><span>${name}</span><span class="dot-tag">${count}</span></div>`).join('') : `<div class="list-item"><span>No fish yet</span><span class="dot-tag">0</span></div>`;
    }
    function renderShop(){
      const list = [
        { name: "Dory", cost: 60 },
        { name: "Harbor Skiff", cost: 200 },
        { name: "Tidebreaker", cost: 550 },
        { name: "Aurora Gull", cost: 900 }
      ];
      ui.shopList.innerHTML = list.map(item => {
        const owned = state.boatInventory.includes(item.name);
        const active = state.currentBoat === item.name;
        return `
          <div class="list-item">
            <span>${item.name}</span>
            <div>
              ${owned ? `<button data-boat="${item.name}" class="${active ? 'success' : 'primary'}">${active ? 'Used' : 'Use'}</button>` : `<button data-buyboat="${item.name}" class="gold">Buy ${item.cost}</button>`}
            </div>
          </div>
        `;
      }).join('');
      ui.shopList.querySelectorAll('[data-buyboat]').forEach(btn => btn.addEventListener('click', () => {
        const name = btn.dataset.buyboat; const cost = list.find(x => x.name === name).cost;
        if (state.money >= cost) { state.money -= cost; state.boatInventory.push(name); state.currentBoat = name; updateHud(); renderShop(); }
      }));
      ui.shopList.querySelectorAll('[data-boat]').forEach(btn => btn.addEventListener('click', () => { state.currentBoat = btn.dataset.boat; updateHud(); renderShop(); }));
    }
    function renderQuests(){
      ui.questList.innerHTML = questDefs.map(q => {
        const progress = Math.min(q.progress, q.target);
        const done = progress >= q.target;
        return `
          <div class="list-item">
            <div><div>${q.title}</div><small>${progress}/${q.target}</small></div>
            <span class="dot-tag">${done ? '✓' : '!'}</span>
          </div>
        `;
      }).join('');
    }
    function markQuestProgress(id, amount = 1){
      const q = questDefs.find(x => x.id === id); if (!q) return;
      q.progress = Math.min(q.progress + amount, q.target);
      if (q.progress >= q.target) {
        state.money += q.reward.money || 0;
        state.xp += q.reward.xp || 0;
      }
      renderQuests(); updateHud();
    }
    function getFishForRegion(region, weather){
      let fishPool = fishCatalog.filter(f => f.region === region && (f.weather.includes(weather) || f.weather.includes('Cloudy') || f.weather.includes('Sunny')));
      if (!fishPool.length) fishPool = fishCatalog.filter(f => f.region === region);
      if (!fishPool.length) fishPool = fishCatalog;
      return fishPool[Math.floor(Math.random() * fishPool.length)];
    }
    function getSpawnWeight(fish){ return +(Math.random() * (fish.maxWeight - fish.minWeight) + fish.minWeight).toFixed(2); }
    function startFishing(){
      if (state.fishing) return;
      const fish = getFishForRegion(state.currentRegion, state.weather);
      state.activeFish = fish; state.fishing = true; state.holding = false;
      ui.miniFishName.textContent = fish.name;
      ui.miniRarity.textContent = fish.rarity;
      state.fishingState = { fishX: 10, fishDir: 1, zoneMin: 34, zoneMax: 62, progress: 0, escape: 0, fishSpeed: 0.7 + fish.difficulty / 120 };
      ui.miniFish.style.left = '10%'; ui.miniPlayer.style.left = '50%';
      ui.miniGame.classList.add('active');
      ui.miniOutput.textContent = `A ${fish.name} is biting! Keep the line steady.`;
      clearInterval(state.fishingFrame);
      state.fishingFrame = setInterval(stepFishing, 30);
    }
    function stepFishing(){
      if (!state.fishing || !state.activeFish) return;
      const fs = state.fishingState; const rod = getRodByName(state.currentRod);
      if (fs.fishX <= 8 || fs.fishX >= 88) fs.fishDir *= -1;
      fs.fishX += fs.fishDir * (fs.fishSpeed * (1.2 + rod.strength * 0.15));
      ui.miniFish.style.left = `${clamp(fs.fishX, 4, 92)}%`;
      let playerTarget = 50;
      if (state.holding) playerTarget = clamp(50 + (fs.fishX - 50) * 0.24, 18, 82);
      ui.miniPlayer.style.left = `${playerTarget}%`;
      const fishCenter = fs.fishX; const playerCenter = playerTarget;
      const fishInZone = fishCenter >= fs.zoneMin && fishCenter <= fs.zoneMax;
      const controlWindow = Math.abs(playerCenter - fishCenter) < 18;
      if (state.holding) {
        if (fishInZone && controlWindow) { fs.progress += 1.4 + rod.control * 0.7; fs.escape -= 0.9; }
        else { fs.escape += 1.2 + rod.resilience * 0.2; }
      } else { fs.escape += 0.8; }
      fs.escape = clamp(fs.escape, 0, 100); fs.progress = clamp(fs.progress, 0, 100);
      ui.miniProgressBar.style.width = `${fs.progress}%`;
      ui.fishPowerValue.textContent = `${Math.round(fs.escape)}%`;
      ui.controlValue.textContent = `${Math.round(fs.progress)}%`;
      if (fs.progress >= 100) finishCatch();
      if (fs.escape >= 100) finishEscape();
      if (Math.random() < 0.03) {
        fs.zoneMin = clamp(fs.zoneMin + (Math.random() > 0.5 ? 6 : -6), 18, 72); fs.zoneMax = clamp(fs.zoneMin + 18, 28, 82);
      }
    }
    function finishCatch(){
      if (!state.activeFish) return;
      clearInterval(state.fishingFrame);
      state.fishing = false; state.holding = false; ui.miniGame.classList.remove('active');
      const fish = state.activeFish; const rod = getRodByName(state.currentRod); const bait = getBaitByName(state.currentBait);
      const base = fish.value * (1 + rod.luck * 0.18) * (1 + bait.cost / 120);
      const weight = getSpawnWeight(fish);
      let mutation = 'None'; let bonus = 1;
      const mutations = [{ name: 'Golden', chance: .08 }, { name: 'Shimmering', chance: .12 }, { name: 'Frozen', chance: .07 }, { name: 'Electric', chance: .08 }, { name: 'Shadow', chance: .08 }, { name: 'Crystalized', chance: .06 }, { name: 'Ancient', chance: .04 }, { name: 'Giant', chance: .05 }];
      const roll = Math.random();
      if (roll < 0.22) {
        const chosen = mutations.find(m => roll < m.chance) || mutations[0];
        mutation = chosen.name; bonus = 1.5 + Math.random() * 1.2;
      }
      const reward = Math.round(base * bonus);
      state.money += reward; state.xp += Math.round(15 + fish.value * 0.3 + (mutation !== 'None' ? 25 : 0));
      if (!state.discovered.includes(fish.name)) state.discovered.push(fish.name);
      state.fishInInventory.push({ ...fish, mutation, weight, reward });
      if (fish.rarity === 'Legendary' || fish.rarity === 'Mythic' || fish.rarity === 'Ancient' || fish.rarity === 'Secret') state.money += 80;
      markQuestProgress('catch5', 1);
      if (fish.name === 'Silverfin') markQuestProgress('silverfin', 1);
      if (state.currentRegion === 'Coral Bay') markQuestProgress('coral', 1);
      if (fish.name === 'Stormray' && state.weather === 'Thunderstorm') markQuestProgress('storm', 1);
      if (['Legendary','Mythic','Ancient','Secret'].includes(fish.rarity)) markQuestProgress('legendary', 1);
      renderCollection(); updateHud(); saveGame();
      ui.miniOutput.textContent = `You caught a ${fish.name}${mutation !== 'None' ? ` (${mutation})` : ''}! +${reward} gold.`;
      setTimeout(() => ui.miniOutput.textContent = 'Hold to battle the next fish.', 1500);
      state.activeFish = null;
    }
    function finishEscape(){
      clearInterval(state.fishingFrame); state.fishing = false; state.holding = false; ui.miniGame.classList.remove('active');
      ui.miniOutput.textContent = 'The fish escaped! Try a different bait or timing.';
      setTimeout(() => ui.miniOutput.textContent = 'Hold to battle the next fish.', 1100);
      state.activeFish = null; saveGame();
    }
    function bindControls(){
      ui.castBtn.addEventListener('click', startFishing);
      ui.sellBtn.addEventListener('click', () => {
        const total = state.fishInInventory.reduce((sum, fish) => sum + (fish.reward || 0), 0);
        if (total > 0) { state.money += total; state.fishInInventory = []; renderCollection(); updateHud(); }
        else ui.miniOutput.textContent = 'No fish to sell yet.';
      });
      ui.miniHoldBtn.addEventListener('pointerdown', () => { if (state.fishing) state.holding = true; });
      ui.miniHoldBtn.addEventListener('pointerup', () => state.holding = false);
      ui.miniReleaseBtn.addEventListener('click', () => state.holding = false);
      document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (state.fishing) state.holding = true; } });
      document.addEventListener('keyup', e => { if (e.code === 'Space') state.holding = false; });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.fishing) finishEscape(); });
    }
    function updateTime(){
      state.time += 1; if (state.time >= 24) state.time = 0;
      state.weather = maybeWeatherInfluence(state.currentRegion, getWeatherForTime(state.time));
      unlockRegions(); updateHud();
    }
    function unlockRegions(){
      Object.keys(regions).forEach((name, idx) => {
        if (name === 'Starter Island') regions[name].unlocked = true;
        else regions[name].unlocked = state.level >= (idx + 1) * 2;
      });
      state.unlocks = Object.keys(regions).filter(name => regions[name].unlocked);
      renderTravelButtons();
    }
    function saveGame(){
      localStorage.setItem(state.saveKey, JSON.stringify({
        money: state.money,
        xp: state.xp,
        level: state.level,
        currentRegion: state.currentRegion,
        currentRod: state.currentRod,
        currentBait: state.currentBait,
        currentBoat: state.currentBoat,
        rodInventory: state.rodInventory,
        baitInventory: state.baitInventory,
        boatInventory: state.boatInventory,
        fishInInventory: state.fishInInventory,
        discovered: state.discovered,
        unlocks: state.unlocks,
        weather: state.weather,
        time: state.time
      }));
    }
    function loadGame(){
      const raw = localStorage.getItem(state.saveKey); if (!raw) return;
      try {
        const save = JSON.parse(raw);
        Object.assign(state, { ...state, ...save });
      } catch (e) {}
    }
    function init(){
      loadGame();
      renderWorld(); renderRodList(); renderBaitList(); renderCollection(); renderShop(); renderTravelButtons(); renderQuests(); bindControls(); updateHud();
      setInterval(() => { updateTime(); renderWorld(); }, 5000);
    }
    init();
  </script>
</body>
</html>
